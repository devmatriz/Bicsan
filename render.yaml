databases:
  - name: bicsan-db
    databaseName: bicsan
    user: bicsan

services:
  - type: web
    name: bicsan
    runtime: python
    buildCommand: bash build.sh
    startCommand: python -m gunicorn bicsan.wsgi:application
    healthCheckPath: /api/salud/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bicsan-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: mandatory
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false

{% extends "account/base_auth.html" %}
{% block title %}Cerrar sesión{% endblock %}
{% block content %}
  <div class="auth-heading"><span class="auth-kicker">Cuenta BICSAN</span><h1>Cerrar sesión</h1><p>¿Seguro que deseas salir de tu cuenta?</p></div>
  <form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button class="auth-submit" type="submit">Sí, cerrar sesión</button></form>
  <p class="auth-switch"><a href="{% url 'cuenta' %}">Cancelar y volver a mi cuenta</a></p>
{% endblock %}

# BICSAN en producción: Nginx (proxy inverso) -> Django/Gunicorn -> PostgreSQL.
# Solo Nginx publica puertos; la app y la base viven en redes internas de Docker.
# Los valores secretos se leen del archivo .env del servidor (nunca del repositorio).

x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *logs

  web:
    build: .
    image: bicsan-web
    restart: unless-stopped
    env_file: .env
    environment:
      # La conexión a la base va por la red interna de Docker, sin salir del servidor.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_SSL_REQUIRE: "false"
      DJANGO_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - estaticos:/app/staticfiles
    networks:
      - interna
      - publica
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          r = urllib.request.Request('http://127.0.0.1:8000/api/salud/',
          headers={'Host': os.environ['DOMINIO'], 'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(r, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    <<: *logs

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Define DOMINIO en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/bicsan.conf.template:/etc/nginx/templates/default.conf.template:ro
      - estaticos:/var/www/bicsan/assets:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - publica
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-salud"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *logs

volumes:
  datos_postgres:
  estaticos:

networks:
  # Red sin salida a internet: solo la app puede hablar con PostgreSQL.
  interna:
    internal: true
  publica:
